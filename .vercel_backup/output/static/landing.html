<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>George – nový Internetbanking – Slovenská sporiteľňa, a.s.</title>
    <link rel="icon" href="/assets/img/favicon.svg"/>
    <link rel="stylesheet" href="/styles.9b3aeb1b2d0432e2.css"/>
    <!-- Additional meta tags from original -->
    <meta name="description" content="Prihláste sa do nového Internetbankingu Slovenskej sporiteľne. S Georgeom bankujete jednoduchšie a s väčším prehľadom."/>
    <meta name="robots" content="NOINDEX, NOFOLLOW"/>
    <meta name="google-play-app" content="sk.slsp.georgego"/>
    <meta name="referrer" content="no-referrer"/>
    <base href="/asgui/george/"/>
  </head>
  <body>
    <script src="/assets/src/noIeSupport.js" type="text/javascript"></script>
    <sezam-root></sezam-root>
    <noscript class="d-flex">
      <div class="login-box justify-content-center">
        <div class="alert alert-t alert-error">
          <span class="title">Pozor!</span>
          <p>Pre správne fungovanie Georgea potrebujete mať povolený javascript.</p>
        </div>
        <div class="container-fluid">
          <div class="row wrapper">
            <div class="logo mt-md-5 mb-2 ml-auto mr-auto"></div>
            <h2 class="col-12 mt-3 mb-3">Prihlásenie do Georgea</h2>
            <form name="loginForm" class="mt-0 mt-md-4 mb-5" ng-submit="submit()">
              <div class="element-box mt-3 mb-3">
                <label for="firstFactorUsername">Prihlasovacie meno/Alias</label>
                <input type="text" disabled class="form-control login_form_control" id="firstFactorUsername"/>
              </div>
              <div class="element-box passwd-box mt-3 mb-1">
                <label for="firstFactorPassword">Heslo</label>
                <input type="password" disabled class="form-control login_form_control" autocomplete="off" id="firstFactorPassword"/>
              </div>
              <button type="button" disabled class="btn btn-primary">Prihlásiť sa</button>
            </form>
          </div>
        </div>
      </div>
      <footer>
        <div class="logo"></div>
      </footer>
    </noscript>
    <script src="/runtime.1d9f9110e900a2ef.js" type="module"></script>
    <script src="/polyfills.1740f7a7cb25cc3d.js" type="module"></script>
    <script src="/main.fa70d615c58da0b0.js" type="module"></script>
  </body>
</html>
