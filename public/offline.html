<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#091b3f">
  <meta name="robots" content="noindex, nofollow" />
  <title>Offline – George</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      background: linear-gradient(160deg, #091b3f 0%, #0d2b5e 50%, #091b3f 100%);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
    }

    .container {
      text-align: center;
      max-width: 440px;
      width: 100%;
    }

    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 32px;
    }

    .logo img {
      width: 100%;
      height: 100%;
    }

    .icon-circle {
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .icon-circle svg {
      width: 36px;
      height: 36px;
      opacity: 0.7;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .status-bar {
      margin-top: 48px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
      animation: pulse-red 2s ease-in-out infinite;
    }

    .status-bar.online {
      border-color: rgba(34, 197, 94, 0.3);
      background: rgba(34, 197, 94, 0.08);
      color: rgba(34, 197, 94, 0.9);
    }

    .status-bar.online .status-dot {
      background: #22c55e;
      animation: pulse-green 2s ease-in-out infinite;
    }

    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes pulse-green {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-circle">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12 18.75h.008v.008H12v-.008Z"/>
        <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>Ste offline</h1>
    <p>
      Zdá sa, že nemáte pripojenie na internet.
      Skontrolujte pripojenie a skúste to znova.
    </p>

    <button class="btn" onclick="location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.992 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182"/>
      </svg>
      Skúsiť znova
    </button>

    <div class="status-bar" id="status">
      <span class="status-dot"></span>
      <span id="status-text">Offline – čakám na pripojenie…</span>
    </div>
  </div>

  <script>
    function updateStatus() {
      const statusBar = document.getElementById('status')
      const statusText = document.getElementById('status-text')

      if (navigator.onLine) {
        statusBar.classList.add('online')
        statusText.textContent = 'Online – môžete obnoviť stránku'
      } else {
        statusBar.classList.remove('online')
        statusText.textContent = 'Offline – čakám na pripojenie…'
      }
    }

    window.addEventListener('online', () => {
      updateStatus()
      // Auto-reload after short delay when back online
      setTimeout(() => location.reload(), 1500)
    })
    window.addEventListener('offline', updateStatus)
    updateStatus()
  </script>
</body>
</html>
