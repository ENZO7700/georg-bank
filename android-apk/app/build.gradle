plugins {
    id 'com.android.application'
}

android {
    namespace 'sk.slsp.george.app'
    compileSdk 35

    defaultConfig {
        applicationId "sk.slsp.george.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file('../george-release.keystore')
            storePassword 'george123'
            keyAlias 'george'
            keyPassword 'george123'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Standard native Android dependencies
}
